<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var _fetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var descriptor = {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e) {}

          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (e) {}
        } catch (err) {}
      })();
    </script>

    <script>
      // Limpeza única por empresa neste aparelho: descarta a cópia local antiga (dados de exemplo) ANTES do sistema carregar.
      (function () {
        try {
          var active = localStorage.getItem('contaju_active_org');
          if (!active || localStorage.getItem('contaju_limpeza_mock_v1') === active) return;
          var keep = ['contaju_auth_session','contaju_current_user_id','contaju_theme','contaju_orgs','contaju_active_org','contaju_is_consultant','contaju_view_mode','contaju_cache_org','contaju_limpeza_mock_v1','contaju_supabase_url','contaju_supabase_anon_key','contaju_supabase_auto_sync','contaju_sidebar_minimized','contaju_calc_open','contaju_calc_minimized'];
          var rm = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('contaju_') === 0 && keep.indexOf(k) === -1) rm.push(k);
          }
          rm.forEach(function (k) { localStorage.removeItem(k); });
          try { indexedDB.deleteDatabase('contaju_db'); } catch (e) {}
          localStorage.setItem('contaju_cache_org', active);
          localStorage.setItem('contaju_limpeza_mock_v1', active);
        } catch (e) {}
      })();
    </script>
